<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Master Matteos Jernlog">
<meta name="theme-color" content="#0a0b0d">
<link rel="apple-touch-icon" href="icon-180-v1.png">
<link rel="manifest" href="manifest.json">
<title>Master Matteos Jernlog</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<defs>
<symbol id="ic-feed" viewBox="0 0 24 24"><path d="M4 15c2-1 3.5-4 4-7 1 5 2 8 4 8s2-6 3-9c1 6 2 8 5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5v4M16 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="7" y="13" width="3" height="3" rx="0.5" fill="currentColor"/></symbol>
<symbol id="ic-barbell" viewBox="0 0 24 24"><path d="M6.5 12h11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><rect x="1.5" y="9.3" width="2.6" height="5.4" rx="0.8" fill="currentColor" stroke="none"/><rect x="19.9" y="9.3" width="2.6" height="5.4" rx="0.8" fill="currentColor" stroke="none"/><rect x="4.3" y="7.3" width="2.3" height="9.4" rx="0.8" fill="currentColor" stroke="none"/><rect x="17.4" y="7.3" width="2.3" height="9.4" rx="0.8" fill="currentColor" stroke="none"/></symbol>
<symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.2V12l3.6 2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.2-3.8 4-5.7 7-5.7s5.8 1.9 7 5.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="ic-medal" viewBox="0 0 24 24"><path d="M12 2l2.4 5 5.6.6-4.2 3.7 1.2 5.4L12 13.9 7 16.7l1.2-5.4L4 7.6l5.6-.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="ic-comment" viewBox="0 0 24 24"><path d="M4 5.5h16v11H10l-4 3.5v-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="ic-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-program" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="ic-friends" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="ic-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-logout" viewBox="0 0 24 24"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M13 8l4.5 4-4.5 4M9.5 12H20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="ic-trend-down" viewBox="0 0 24 24"><path d="M4 8l5 6 4-3 7 9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="1.6" fill="currentColor"/></symbol>
</defs>
</svg>
<div class="app" id="app">
  <header class="topbar">
    <div class="title" id="appTitleBtn" style="cursor:pointer;"><span class="dot"></span> Master Matteos Jernlog-app</div>
    <button class="menu-btn" id="menuBtn" style="display:none;"><svg><use href="#ic-menu"/></svg></button>
  </header>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel">
      <div class="menu-item" data-view="comments"><span class="ic"><svg><use href="#ic-comment"/></svg></span> Kommentarer <span class="req-dot" id="commentDot" style="display:none;">0</span></div>
      <div class="menu-item" data-view="exercises"><span class="ic"><svg><use href="#ic-program"/></svg></span> Øvelser/Mit program</div>
      <div class="menu-item" data-view="friends"><span class="ic"><svg><use href="#ic-friends"/></svg></span> Venner <span class="req-dot" id="friendReqDot" style="display:none;">0</span></div>
      <div class="menu-item" data-view="admin" id="menuAdminItem" style="display:none;"><span class="ic"><svg><use href="#ic-shield"/></svg></span> Godkend brugere <span class="req-dot" id="adminReqDot" style="display:none;">0</span></div>
      <div class="menu-item" id="menuLogout"><span class="ic"><svg><use href="#ic-logout"/></svg></span> Log ud <span class="muted" id="menuUser" style="margin-left:auto;font-size:12px;"></span></div>
      <div style="padding:8px 18px;font-size:11px;color:var(--text-dim);text-align:right;">version 15.7-C</div>
    </div>
  </div>

  <main id="main"></main>

  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="bn-item" data-view="feed"><span class="bn-ic"><svg><use href="#ic-feed"/></svg></span><span class="bn-label">Feed</span></button>
    <button class="bn-item" data-view="calendar"><span class="bn-ic"><svg><use href="#ic-calendar"/></svg></span><span class="bn-label">Kalender</span></button>
    <button class="bn-item" data-view="log"><span class="bn-ic"><svg><use href="#ic-barbell"/></svg></span><span class="bn-label">Log øvelse</span></button>
    <button class="bn-item" data-view="history"><span class="bn-ic"><svg><use href="#ic-clock"/></svg></span><span class="bn-label">Historik</span></button>
    <button class="bn-item" data-view="dig"><span class="bn-ic"><svg><use href="#ic-user"/></svg></span><span class="bn-label">Dig</span></button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-layer" id="confettiLayer"></div>

<script src="app-core.js"></script>
<script src="app-log.js"></script>
<script src="app-history.js"></script>
<script src="app-exercises.js"></script>
<script src="app-calendar-dig.js"></script>
<script src="app-feed.js"></script>
<script src="app-admin-friends.js"></script>
</body>
</html>
